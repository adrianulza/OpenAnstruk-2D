<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The Worker fills this in from GOOGLE_CLIENT_ID (worker/index.ts, loginPage). -->
<meta name="oa-client-id" content="">
<title>Masuk · OpenAnstruk</title>
<link rel="icon" href="/OpenAnstruk-Logo_BgNavy.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap">
<style>
  :root { --ink: #0b2550; --ink-2: #4a5a6e; --ink-3: #5b6b7e; --rule: #d9e1ec; --paper: #f5f8fd; --white: #fff; --bad: #a3242c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #e6eefa, var(--paper) 60%);
    font: 400 16px/1.55 'DM Sans', system-ui, sans-serif; color: var(--ink);
  }
  .card {
    width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--rule); border-radius: 18px;
    padding: 36px 32px 28px; text-align: center; box-shadow: 0 24px 48px -28px rgba(11, 37, 80, .35);
  }
  /* the brand lockup exactly as the landing page draws it: the mark is the O of the wordmark */
  .brand { display: inline-flex; align-items: flex-start; text-decoration: none; margin-bottom: 26px; }
  .brand .mark { width: 34px; height: 34px; flex: none; overflow: visible; }
  .brand .needle { fill: #d4a25a; }
  .brand .wordmark { height: 25.5px; width: auto; margin: 8.4px 0 0 1.7px; }
  h1 { margin: 0 0 8px; font: 400 30px/1.1 'DM Serif Display', Georgia, serif; letter-spacing: -.01em; }
  .lede { margin: 0 0 26px; color: var(--ink-2); }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  .msg { min-height: 1.5em; margin: 14px 0 0; font-size: 14px; color: var(--bad); }
  .fine { margin: 18px 0 0; font-size: 13px; color: var(--ink-3); }
  .fine a { color: var(--ink); }
  .back { display: inline-block; margin-top: 22px; font: 500 11px/1 'DM Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-decoration: none; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/" aria-label="OpenAnstruk, beranda">
    <svg class="mark" viewBox="0 0 287 287" aria-hidden="true">
      <image href="/landing/mark.png" width="287" height="287"/>
      <polygon class="needle" points="282,148 68,192 35,235"/>
    </svg>
    <img class="wordmark" src="/landing/wordmark.png" alt="OpenAnstruk" width="132" height="25">
  </a>
  <h1>Masuk</h1>
  <p class="lede">Masuk dengan akun Google untuk memakai OpenAnstruk 2D dan 3D. Gratis.</p>
  <div id="gbtn" aria-live="polite"></div>
  <p class="msg" id="msg" role="alert"></p>
  <p class="fine">Pengguna baru akan diminta melengkapi profil singkat. Dengan masuk, Anda menyetujui <a href="/privasi">Kebijakan Privasi</a>.</p>
  <a class="back" href="/">← Beranda</a>
</main>
<script>
(() => {
  const msg = document.getElementById('msg')
  const clientId = document.querySelector('meta[name="oa-client-id"]').content
  const next = new URLSearchParams(location.search).get('next') || '/app'

  async function onCredential(r) {
    msg.textContent = ''
    try {
      const res = await fetch('/api/auth/google', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ credential: r.credential, next }),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || 'Gagal masuk. Coba lagi.')
      location.assign(data.redirect)
    } catch (e) { msg.textContent = e.message }
  }

  function start() {
    if (!clientId) { msg.textContent = 'Login belum dikonfigurasi.'; return }
    google.accounts.id.initialize({ client_id: clientId, callback: onCredential, ux_mode: 'popup', use_fedcm_for_prompt: true })
    google.accounts.id.renderButton(document.getElementById('gbtn'),
      { theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', locale: 'id', width: 300 })
  }

  const s = document.createElement('script')
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true
  s.onload = start
  s.onerror = () => { msg.textContent = 'Tidak bisa memuat login Google. Periksa koneksi atau pemblokir iklan.' }
  document.head.appendChild(s)
})()
</script>
</body>
</html>
