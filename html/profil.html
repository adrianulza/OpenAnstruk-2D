<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Profil · OpenAnstruk</title>
<link rel="icon" href="/OpenAnstruk-Logo_BgNavy.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap">
<style>
  :root { --ink: #0b2550; --ink-2: #4a5a6e; --ink-3: #5b6b7e; --rule: #d9e1ec; --paper: #f5f8fd; --white: #fff; --bad: #a3242c; --hi: #1a3d7c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #e6eefa, var(--paper) 60%);
    font: 400 16px/1.55 'DM Sans', system-ui, sans-serif; color: var(--ink);
  }
  .card { width: 100%; max-width: 460px; background: var(--white); border: 1px solid var(--rule); border-radius: 18px;
    padding: 32px 32px 26px; box-shadow: 0 24px 48px -28px rgba(11, 37, 80, .35); }
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .who img { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); }
  .who .em { font: 400 13px/1.3 'DM Mono', ui-monospace, monospace; color: var(--ink-3); word-break: break-all; }
  h1 { margin: 0 0 6px; font: 400 28px/1.15 'DM Serif Display', Georgia, serif; letter-spacing: -.01em; }
  .lede { margin: 0 0 22px; color: var(--ink-2); }
  label { display: block; margin: 0 0 16px; font-weight: 500; font-size: 14px; }
  label > span.h { display: block; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--white);
    font: 400 16px 'DM Sans', system-ui, sans-serif; color: var(--ink);
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--hi); outline-offset: 1px; border-color: var(--hi); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--ink-2); }
  .check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--ink); }
  .check a { color: var(--ink); }
  .btn { width: 100%; height: 48px; border: 0; border-radius: 999px; background: var(--ink); color: var(--white);
    font: 600 16px 'DM Sans', system-ui, sans-serif; cursor: pointer; box-shadow: 0 10px 22px -12px rgba(11, 37, 80, .55); }
  .btn:hover { background: var(--hi); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; color: var(--bad); }
  .links { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; font: 500 11px/1 'DM Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .links a { color: var(--ink-3); text-decoration: none; } .links a:hover { color: var(--ink); }
  .danger { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .danger h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .danger p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
  .btn-bad { height: 40px; padding: 0 18px; border: 1px solid var(--bad); border-radius: 999px; background: var(--white); color: var(--bad);
    font: 600 14px 'DM Sans', system-ui, sans-serif; cursor: pointer; }
  .btn-bad.solid { background: var(--bad); color: var(--white); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" id="card" hidden>
  <div class="who"><img id="pic" alt="" width="44" height="44" referrerpolicy="no-referrer"><div><div id="nm"></div><div class="em" id="em"></div></div></div>
  <h1 id="title">Satu langkah lagi</h1>
  <p class="lede" id="lede">Lengkapi profil singkat ini sekali saja, lalu Anda bisa langsung memakai app.</p>

  <form id="f" novalidate>
    <label><span class="h">Nama</span><input type="text" name="name" autocomplete="name" maxlength="100" required></label>
    <label><span class="h">Tahun lahir</span><select name="birth_year" required></select></label>
    <label><span class="h">Pekerjaan</span>
      <select name="occupation" required>
        <option value="">Pilih…</option>
        <option>Mahasiswa</option><option>Dosen/Peneliti</option><option>Engineer/Konsultan</option>
        <option>Kontraktor/Pelaksana</option><option>Arsitek</option><option>Lainnya</option>
      </select>
    </label>
    <label id="other" hidden><span class="h">Pekerjaan Anda</span><input type="text" name="occupation_other" maxlength="60"></label>
    <label><span class="h">Institusi atau perusahaan</span><input type="text" name="institution" autocomplete="organization" maxlength="150" placeholder="mis. Universitas Syiah Kuala" required></label>
    <label class="check"><input type="checkbox" name="consent"><span>Saya berusia 18 tahun atau lebih dan menyetujui <a href="/privasi" target="_blank" rel="noopener">Kebijakan Privasi</a>.</span></label>
    <button class="btn" id="go" type="submit">Mulai pakai</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <section class="danger" id="danger" hidden>
    <h2>Hapus akun</h2>
    <p>Nama, email, profil, dan riwayat pemakaian Anda dihapus permanen. Model dan berkas Anda tidak terpengaruh karena memang tidak kami simpan.</p>
    <div class="row">
      <button class="btn-bad" id="del1" type="button">Hapus akun saya</button>
      <span id="del2" hidden class="row"><button class="btn-bad solid" id="delyes" type="button">Ya, hapus permanen</button><button class="btn-bad" id="delno" type="button">Batal</button></span>
    </div>
  </section>

  <nav class="links"><a href="/app" id="back">← Kembali ke app</a><a href="/logout">Keluar →</a></nav>
</main>
<script>
(async () => {
  const $ = id => document.getElementById(id)
  const f = $('f'), msg = $('msg')
  const next = new URLSearchParams(location.search).get('next') || 'https://2d.openanstruk.org/'

  // Back after signing out shows this page from the browser cache with a dead session: reload it,
  // so the server sends the visitor to sign in instead.
  addEventListener('pageshow', e => { if (e.persisted) location.reload() })

  // "Kembali ke app" returns to the app the visitor came from (this site, or the 3D app), never elsewhere.
  const safe = /^\/(?![\/\\])/.test(next) || /^https:\/\/[23]d\.openanstruk\.org(\/|$)/.test(next) ? next : '/app'
  $('back').href = safe
  const toLogin = () => location.assign('/login?next=' + encodeURIComponent('/profil?next=' + next))

  const year = new Date().getFullYear()
  const ys = f.birth_year
  ys.add(new Option('Pilih…', ''))
  for (let y = year - 18; y >= year - 100; y--) ys.add(new Option(String(y), String(y)))

  const res = await fetch('/api/profile', { credentials: 'same-origin' })
  if (res.status === 401) { location.replace('/login?next=' + encodeURIComponent('/profil?next=' + next)); return }
  const p = await res.json()

  $('nm').textContent = p.name || ''
  $('em').textContent = p.email
  if (p.picture) $('pic').src = p.picture; else $('pic').hidden = true
  f.name.value = p.name || ''
  if (p.birth_year) ys.value = String(p.birth_year)
  if (p.occupation) {
    if (p.occupation.startsWith('Lainnya: ')) { f.occupation.value = 'Lainnya'; f.occupation_other.value = p.occupation.slice(9) }
    else f.occupation.value = p.occupation
  }
  f.institution.value = p.institution || ''
  if (p.complete) {
    $('title').textContent = 'Profil Anda'
    $('lede').textContent = 'Perbarui data Anda kapan saja.'
    $('go').textContent = 'Simpan'
    f.consent.checked = true
    $('danger').hidden = false
    if (location.hash === '#hapus') requestAnimationFrame(() => $('danger').scrollIntoView({ block: 'center' }))
  }
  const syncOther = () => { $('other').hidden = f.occupation.value !== 'Lainnya' }
  f.occupation.addEventListener('change', syncOther); syncOther()
  $('card').hidden = false

  f.addEventListener('submit', async e => {
    e.preventDefault()
    msg.textContent = ''
    const body = {
      name: f.name.value, birth_year: Number(ys.value), occupation: f.occupation.value,
      occupation_other: f.occupation_other.value, institution: f.institution.value, consent: f.consent.checked, next,
    }
    if (!body.name.trim()) return (msg.textContent = 'Nama wajib diisi.')
    if (!body.birth_year) return (msg.textContent = 'Pilih tahun lahir.')
    if (!body.occupation) return (msg.textContent = 'Pilih pekerjaan.')
    if (body.occupation === 'Lainnya' && !body.occupation_other.trim()) return (msg.textContent = 'Tuliskan pekerjaan Anda.')
    if (!body.institution.trim()) return (msg.textContent = 'Institusi atau perusahaan wajib diisi.')
    if (!body.consent) return (msg.textContent = 'Centang persetujuan untuk melanjutkan.')
    $('go').disabled = true
    try {
      const r = await fetch('/api/profile', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      if (r.status === 401) return toLogin()
      const d = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(d.error || 'Gagal menyimpan. Coba lagi.')
      location.assign(d.redirect)
    } catch (err) { msg.textContent = err.message; $('go').disabled = false }
  })

  $('del1').onclick = () => { $('del1').hidden = true; $('del2').hidden = false }
  $('delno').onclick = () => { $('del1').hidden = false; $('del2').hidden = true }
  $('delyes').onclick = async () => {
    $('delyes').disabled = true
    const r = await fetch('/api/account/delete', { method: 'POST', credentials: 'same-origin' })
    if (r.status === 401) return toLogin()
    if (r.ok) location.assign('/'); else { $('delyes').disabled = false; msg.textContent = 'Gagal menghapus akun. Coba lagi atau email team@openanstruk.org.' }
  }
})()
</script>
</body>
</html>
